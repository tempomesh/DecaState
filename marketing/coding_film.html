<meta charset="utf-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@600;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:800px;overflow:hidden;background:#07090e;font-family:'JetBrains Mono',monospace}
  .pad{padding:40px 46px}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
  .brand{font-family:'Manrope',sans-serif;font-weight:800;font-size:24px;color:#e9edf5}
  .brand .m{color:#c3f53c}
  .host{font-size:15px;color:#7f8aa3}
  .host b{color:#c3f53c;font-weight:500}
  .term{border:1px solid #1c2230;border-radius:16px;background:#0a0d13;height:640px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.5)}
  .bar{height:46px;background:#11151d;display:flex;align-items:center;padding:0 18px;gap:9px;border-bottom:1px solid #171c27}
  .bar i{width:12px;height:12px;border-radius:50%}
  .bar .t{margin-left:14px;font-size:15px;color:#7f8aa3}
  .body{padding:24px 30px;font-size:20px;line-height:1.5;white-space:pre-wrap;color:#cdd6e6}
  .p{color:#7f8aa3}.g{color:#c3f53c}.c{color:#6fb7ff}.w{color:#e9edf5}.y{color:#f5c451}.d{color:#7f8aa3}
  .cur{display:inline-block;width:11px;height:22px;background:#c3f53c;vertical-align:-4px}
</style>
<div class="pad">
  <div class="top">
    <div class="brand"><span class="m">◈</span> DecaState</div>
    <div class="host">Apple <b>M4 Max</b> · <b>64 GB</b> · MLX-LM 0.31.3 · local, no cloud</div>
  </div>
  <div class="term">
    <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span class="t">~/DecaState — zsh</span></div>
    <div class="body" id="body"></div>
  </div>
</div>
<script>
// Real captured session. Each item: text + class + optional pause after (ms) + instant(no type)
const S = [
  {t:'$ ',c:'p'},{t:'decastate doctor\n',c:'w',pause:500},
  {t:'chip: ',c:'d'},{t:'Apple M4 Max\n',c:'g',type:false},
  {t:'memory: ',c:'d'},{t:'64 GB\n',c:'g',type:false},
  {t:'mlx-lm: ',c:'d'},{t:'0.31.3   device: gpu\n\n',c:'g',type:false,pause:600},

  {t:'$ ',c:'p'},{t:'decastate understand .   ',c:'w'},{t:'# read the whole repo, once\n',c:'d',pause:400},
  {t:'  building native MLX state',c:'d',type:false},{t:' …\n',c:'d',type:false,pause:700},
  {t:'  ✓ ',c:'g',type:false},{t:'8,486 tokens',c:'w',type:false},{t:' understood → ',c:'d',type:false},{t:'99 MB',c:'y',type:false},{t:' native state\n\n',c:'d',type:false,pause:600},

  {t:'$ ',c:'p'},{t:'decastate checkpoint gifdemo repo-understood\n',c:'w',pause:400},
  {t:'  ✓ ',c:'g',type:false},{t:'checkpoint "repo-understood"',c:'w',type:false},{t:' · immutable · fingerprint-guarded\n\n',c:'d',type:false,pause:600},

  {t:'$ ',c:'p'},{t:'decastate fork reviewer\n',c:'w',pause:400},
  {t:'  ✓ ',c:'g',type:false},{t:'branch "reviewer"',c:'w',type:false},{t:' forked in ',c:'d',type:false},{t:'0.066 s\n\n',c:'g',type:false,pause:600},

  {t:'# … kill the process. reboot the Mac. come back tomorrow …\n\n',c:'d',pause:500},

  {t:'$ ',c:'p'},{t:'decastate rollback gifdemo repo-understood\n',c:'w',pause:400},
  {t:'  ✓ ',c:'g',type:false},{t:'restored native state',c:'w',type:false},{t:' · ',c:'d',type:false},{t:'0 tokens re-read',c:'y',type:false},{t:' · byte-exact\n\n',c:'d',type:false,pause:700},

  {t:'  ',c:'d'},{t:'understand once. wake forever. fork the work, not the context.\n',c:'g',type:false,pause:900},
];
// Build a timed char stream
let STREAM=[]; // {ch,c}
let PAUSES=[]; // index -> extra ms
const TYPE_CPS=48; // chars/sec for typed segments
S.forEach(seg=>{
  const cls=seg.c||'w';
  if(seg.type===false){ for(const ch of seg.t) STREAM.push({ch,c:cls,dt:0}); }
  else { for(const ch of seg.t) STREAM.push({ch,c:cls,dt:1000/TYPE_CPS}); }
  if(seg.pause) STREAM.push({ch:'',c:cls,dt:seg.pause});
});
// Precompute cumulative time per char
let cum=0; STREAM.forEach(s=>{cum+=s.dt; s.time=cum;});
const TOTAL=cum;
window.FILM_DURATION=(TOTAL/1000)+1.2; // +tail
const body=document.getElementById('body');
function renderFrame(t){
  const ms=t*1000;
  let html='';
  for(let i=0;i<STREAM.length;i++){
    if(STREAM[i].time>ms) break;
    const s=STREAM[i]; if(s.ch==='') continue;
    html+=`<span class="${s.c}">${s.ch==='\n'?'<br/>':s.ch.replace('<','&lt;').replace('>','&gt;')}</span>`;
  }
  const blink=(Math.floor(t*2)%2===0)?'<span class="cur"></span>':'<span class="cur" style="opacity:0"></span>';
  body.innerHTML=html+blink;
}
window.renderFrame=renderFrame;
renderFrame(0);
</script>
